<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ДЛЯ АНАСТАСИЙКИ</title>
<style>
  :root {
    --cream: #f7f4ec;
    --sage: #dce8d2;
    --sage-deep: #b7cfa6;
    --green-soft: #8fae7e;
    --green-text: #4a6741;
    --pink: #f3c6cc;
    --yellow: #f6e3a1;
    --white-flower: #fdfbf4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(160deg, var(--cream) 0%, var(--sage) 60%, var(--sage-deep) 100%);
    min-height: 100vh;
    text-align: center;
    color: var(--green-text);
    overflow-x: hidden;
    position: relative;
  }
  /* лепестки-декор по краям */
  .petal {
    position: fixed;
    width: 90px; height: 90px;
    border-radius: 50% 0 50% 50%;
    opacity: .35;
    pointer-events: none;
    z-index: 0;
  }
  .petal.p1 { top:-20px; left:-25px; background: var(--pink); transform: rotate(35deg); }
  .petal.p2 { top:15%; right:-35px; background: var(--yellow); transform: rotate(-60deg); }
  .petal.p3 { bottom:-25px; left:8%; background: var(--sage-deep); transform: rotate(120deg); }
  .petal.p4 { bottom:10%; right:-20px; background: var(--pink); transform: rotate(-15deg); }

  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 48px 20px 60px; }

  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: .08em;
    color: var(--green-text);
    margin-bottom: 6px;
    animation: fadeDown 1.1s ease-out both;
  }
  .subtitle { font-style: italic; opacity: .75; margin-bottom: 28px; animation: fadeDown 1.1s .2s ease-out both; }

  .logo-frame {
    display: inline-block;
    padding: 14px;
    border: 1.5px solid var(--green-soft);
    border-radius: 24px;
    background: rgba(255,255,255,.55);
    box-shadow: 0 8px 30px rgba(74,103,65,.18);
    animation: fadeUp 1.2s .3s ease-out both, sway 6s 1.6s ease-in-out infinite;
  }
  .logo-frame img { max-width: 320px; width: 100%; border-radius: 16px; display: block; }

  .divider {
    margin: 34px auto 20px;
    width: 220px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--green-soft), transparent);
    border-radius: 2px;
  }

  .prompt { font-size: 1.25rem; margin-bottom: 18px; animation: fadeUp 1.1s .5s ease-out both; }

  input[type="date"] {
    font-family: inherit;
    font-size: 1.05rem;
    padding: 12px 18px;
    border: 1.5px solid var(--green-soft);
    border-radius: 14px;
    background: var(--white-flower);
    color: var(--green-text);
    outline: none;
    box-shadow: inset 0 2px 6px rgba(74,103,65,.08);
    transition: box-shadow .3s;
  }
  input[type="date"]:focus { box-shadow: 0 0 0 4px rgba(143,174,126,.25); }

  .btn {
    display: inline-block;
    margin-top: 26px;
    padding: 14px 42px;
    font-family: inherit;
    font-size: 1.05rem;
    letter-spacing: .05em;
    color: #fff;
    background: linear-gradient(135deg, var(--green-soft), var(--green-text));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(74,103,65,.3);
    transition: transform .25s, box-shadow .25s;
    animation: fadeUp 1.1s .7s ease-out both;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(74,103,65,.38); }

  .flowers-row { margin-top: 40px; font-size: 1.6rem; letter-spacing: .4em; animation: fadeUp 1.2s .9s ease-out both; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-1.2deg); } }
</style>
</head>
<body>
  <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div>
  <div class="wrap">
    <h1>ДЛЯ АНАСТАСИЙКИ</h1>
    <p class="subtitle">там, где цветут герберы и эустомы</p>
    <div class="logo-frame">
      <img src="logo.jpeg" alt="Логотип Анастасия" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
      <div id="logoFallback" style="display:none; padding:20px 30px;">
        <div style="font-size:3rem;">🌼 🤍 🌸</div>
        <div style="font-size:2rem; letter-spacing:.1em; margin-top:10px;">АНАСТАСИЯ</div>
      </div>
    </div>
    <div class="divider"></div>
    <p class="prompt">Выберите удобные даты</p>
    <input type="date" id="datePicker">
    <br>
    <button class="btn" onclick="nextPage()">Далее</button>
    <div class="flowers-row">🌼 🤍 🌸</div>
  </div>
<script>
  function nextPage() {
    const date = document.getElementById('datePicker').value;
    if (!date) { alert('Пожалуйста, выберите дату'); return; }
    localStorage.setItem('selectedDate', date);
    window.location.href = 'preferences.html';
  }
</script>
</body>
</html>
